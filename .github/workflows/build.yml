name: Build ninmods-kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 Kernel Overlay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build with ndk-build
        run: |
          set -o pipefail
          echo "Starting ndk-build for ninmods-kernel..."
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j$(nproc)
          echo "Build finished successfully:"
          STRIP_BIN=$(find "$ANDROID_NDK_ROOT" -name "llvm-strip" 2>/dev/null | head -n 1)
          if [ -n "$STRIP_BIN" ] && [ -x "$STRIP_BIN" ]; then
            echo "Stripping with $STRIP_BIN..."
            "$STRIP_BIN" --strip-all --strip-debug --strip-unneeded libs/arm64-v8a/ninmods-kernel || true
          fi
          ls -lh libs/arm64-v8a/
          echo "Packaging native ninmods-kernel into ninmods-kernel.zip..."
          (cd libs/arm64-v8a && zip -9 ninmods-kernel.zip ninmods-kernel)
          ls -lh libs/arm64-v8a/

      - name: Upload Kernel Mod Binary
        uses: actions/upload-artifact@v4
        with:
          name: ninmods-kernel.zip
          path: libs/arm64-v8a/ninmods-kernel.zip
